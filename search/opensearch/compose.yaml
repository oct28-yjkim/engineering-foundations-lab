name: engineering-foundations-opensearch-lab

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      cluster.name: engineering-foundations-opensearch-lab
      node.name: opensearch-lab
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    stop_grace_period: 60s

volumes:
  opensearch-data:
