name: engineering-foundations-opensearch-cluster-lab

x-node: &node
  image: opensearchproject/opensearch:3.9.0
  mem_limit: 2g
  cpus: 1.0
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --show-error 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s&filter_path=timed_out' | grep -q '\"timed_out\":false'"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 60s
  stop_grace_period: 60s

x-environment: &environment
  cluster.name: engineering-foundations-opensearch-cluster-lab
  network.host: "0.0.0.0"
  discovery.seed_hosts: "os-a,os-b,os-c"
  bootstrap.memory_lock: "true"
  OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
  DISABLE_INSTALL_DEMO_CONFIG: "true"
  DISABLE_SECURITY_PLUGIN: "true"

services:
  os-a:
    <<: *node
    environment:
      <<: *environment
      node.name: os-a
      node.roles: "cluster_manager,data,ingest"
      # Fresh, isolated lab bootstrap only. Never copy to a live migration.
      cluster.initial_cluster_manager_nodes: "os-a,os-b,os-c"
    ports:
      - "127.0.0.1:19210:9200"
    volumes:
      - os-a-data:/usr/share/opensearch/data
  os-b:
    <<: *node
    environment:
      <<: *environment
      node.name: os-b
      node.roles: "cluster_manager,data,ingest"
      cluster.initial_cluster_manager_nodes: "os-a,os-b,os-c"
    volumes:
      - os-b-data:/usr/share/opensearch/data
  os-c:
    <<: *node
    environment:
      <<: *environment
      node.name: os-c
      node.roles: "cluster_manager,data,ingest"
      cluster.initial_cluster_manager_nodes: "os-a,os-b,os-c"
    volumes:
      - os-c-data:/usr/share/opensearch/data
  os-d:
    <<: *node
    profiles: [expansion]
    environment:
      <<: *environment
      node.name: os-d
      node.roles: "data,ingest"
    volumes:
      - os-d-data:/usr/share/opensearch/data

volumes:
  os-a-data:
  os-b-data:
  os-c-data:
  os-d-data:
